<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      height: 200px;
      display: grid;
      /* configure the spacing of the columns */
      /* Evenly spaces the items:  */
      grid-template-columns: auto auto;
      grid-template-columns: 100px 100px 200px;
      grid-template-rows: auto;
    }
    .container div {
      border: solid;
    }
  </style>
</head>
<body>
  <div class = "container">
    <div>Item 1</div>
    <div>Item 2</div>
    <div>Item 3</div>
    <div>Item 4</div>
    <div>Item 5</div>
    <div>Item 6</div>
  </div>
</body>
</html>
