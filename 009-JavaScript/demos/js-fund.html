<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    console.log("Hello World");

    let s = "string";

    let n = 123;

    console.log(typeof s);
    console.log(typeof n);

    let o = null;
    // if we don't give a value, will resort to undefined
    let u;

    console.log(typeof o);
    console.log(u);

    let animal = {
      name: "Smeagol",
      species: "cat",
      food: "chicken"
    }

    console.log(animal);

    for(let i = 0; i < 10; i ++) {
      console.log(i);
    }

    let raining = true;
    if(raining) {
      console.log("Bring an umbrella");
    }
    else {
      console.log("No need");
    }

    console.log(typeof raining);


    </script>
  
</body>
</html>
